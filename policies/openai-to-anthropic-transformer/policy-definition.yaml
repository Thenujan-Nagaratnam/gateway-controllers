name: openai-to-anthropic-transformer
version: v0.9.1
description: |
  Translates OpenAI Chat Completions requests to Anthropic Messages format and
  rewrites Anthropic responses back to the OpenAI response shape.

  Non-streaming Messages responses become OpenAI ChatCompletion JSON. Streaming
  responses are converted from Anthropic's Server-Sent Events into OpenAI Chat
  Completions SSE (data: {chunk}\n\n ... data: [DONE]), covering the initial
  delta.role, text and tool-call argument deltas, finish reasons, and final
  usage. Events are parsed incrementally, so it handles the stream in both
  buffered and chunk-by-chunk (true streaming) modes. Supports routed and
  unconditional execution modes.

parameters:
  type: object
  additionalProperties: false
  properties:
    model:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Anthropic model name used in the translated request (for example
        claude-sonnet-4-20250514). Optional: the client's own model wins
        when present — read via the "requestModel" systemParameter (the
        location gateway-controller injects from the proxy's own
        primary-provider template) if set, else a plain top-level "model"
        field — and this is used only as a fallback. At least one of the two
        must resolve to a non-empty value, or the request is rejected with
        400.
      minLength: 1
    providerId:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Provider this translator targets. Used as the upstream cluster name
        (matching an id or as alias in the LlmProxy additionalProviders list) and, in
        multi-provider mode, as the key matched (case-insensitive) against
        SharedContext.Metadata["selected_provider"]. When no provider has been
        selected upstream (single-provider proxy), the translator always runs;
        when a provider has been selected, it runs only if the selection
        matches this provider id. When omitted, routing is left to the route's
        default upstream.
      minLength: 1
    anthropicVersion:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        Value of the anthropic-version request header sent upstream.
      default: "2023-06-01"
      minLength: 1

systemParameters:
  type: object
  properties: {}
