name: semantic-cache
version: v1.1.1
description: |
  Caches LLM responses using semantic similarity over request embeddings to
  reduce repeated upstream calls. Returns cached responses on similarity hits
  and stores successful upstream responses for future reuse.

  Cache entries are bound to the authenticated caller (application/subscriber
  identity), so one caller can never receive another caller's cached response.
  Responses marked Cache-Control: no-store, private, or no-cache are never
  cached. Requests with no resolvable caller identity are not cached unless
  cacheUnauthenticated is explicitly enabled.

parameters:
  type: object
  properties:
    similarityThreshold:
      type: number
      description: |
        Specifies the minimum similarity score (0.0 to 1.0) required to treat a
        request as a cache hit.
      default: 0.5
      minimum: 0.0
      maximum: 1.0
    jsonPath:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Specifies the JSONPath used to extract text for embedding generation.
        When omitted, the entire request body is used.
      default: "$.messages[-1].content"
    streamingJsonPath:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Specifies the JSONPath used to extract content from each SSE streaming
        delta event when caching streamed responses. Only needed if the upstream
        uses a non-OpenAI-compatible streaming format.
      default: "$.choices[0].delta.content"
    cacheUnauthenticated:
      type: boolean
      x-wso2-policy-advanced-param: true
      description: |
        Controls caching behavior for requests with no resolvable caller
        identity (e.g. a fully public, unauthenticated API). Defaults to false:
        such requests are neither served from nor stored into the cache.

        SECURITY WARNING: setting this to true makes all identity-less callers
        of this API share a single cache bucket. Any caller who can influence
        the upstream's response for a given prompt can seed an entry that is
        later served to a DIFFERENT identity-less caller as a trusted cache
        hit (cache poisoning), and a personalized or sensitive response
        produced for one identity-less caller can be replayed to another.
        Only enable this for APIs where every possible response is safe to
        share across all unauthenticated callers.
      default: false
  required:
  - similarityThreshold

systemParameters:
  type: object
  properties:
    embeddingProvider:
      type: string
      description: |
        Embedding provider type: "OPENAI", "MISTRAL", "AZURE_OPENAI"
      enum:
      - OPENAI
      - MISTRAL
      - AZURE_OPENAI
      "wso2/defaultValue": "${config.embedding_provider}"
    embeddingEndpoint:
      type: string
      description: |
        Endpoint URL for the embedding service (required for OPENAI, MISTRAL, AZURE_OPENAI)
        For OpenAI: "https://api.openai.com/v1/embeddings"
        For Mistral: "https://api.mistral.ai/v1/embeddings"
        For Azure OpenAI: Azure OpenAI endpoint URL
      minLength: 1
      "wso2/defaultValue": "${config.embedding_provider_endpoint}"
    embeddingModel:
      type: string
      description: |
        Embedding model name (required for OPENAI, MISTRAL; not required for AZURE_OPENAI)
        For OpenAI: "text-embedding-ada-002" or "text-embedding-3-small"
        For Mistral: "mistral-embed"
        For Azure OpenAI: Not required (deployment name is in the endpoint URL)
      "wso2/defaultValue": "${config.embedding_provider_model}"
    embeddingDimension:
      type: integer
      description: |
        Dimension of embedding vectors (required for some vector databases)
        Common values: 1536 (OpenAI ada-002), 1024 (Mistral), etc.
      "wso2/defaultValue": "${config.embedding_provider_dimension}"
    apiKey:
      type: string
      description: |
        API key for the embedding service (required for OPENAI, MISTRAL, AZURE_OPENAI)
        For Azure OpenAI, this may be the API key or the header name for authentication
      minLength: 1
      "wso2/defaultValue": "${config.embedding_provider_api_key}"
    vectorStoreProvider:
      type: string
      description: |
        Vector database provider: "REDIS" or "MILVUS"
      enum:
      - REDIS
      - MILVUS
      "wso2/defaultValue": "${config.vector_db_provider}"
    dbHost:
      type: string
      description: Vector database host (required for Redis/Milvus)
      minLength: 1
      "wso2/defaultValue": "${config.vector_db_provider_host}"
    dbPort:
      type: integer
      description: Vector database port (required for Redis/Milvus)
      "wso2/defaultValue": "${config.vector_db_provider_port}"
    username:
      type: string
      description: Vector database username (optional)
      "wso2/defaultValue": "${config.vector_db_provider_username}"
    password:
      type: string
      description: Vector database password (optional)
      "wso2/defaultValue": "${config.vector_db_provider_password}"
    database:
      type: string
      description: Vector database (optional)
      "wso2/defaultValue": "${config.vector_db_provider_database}"
    ttl:
      type: integer
      description: Vector database TTL (optional)
      "wso2/defaultValue": "${config.vector_db_provider_ttl}"
  required:
  - embeddingProvider
  - embeddingEndpoint
  - apiKey
  - vectorStoreProvider
  - embeddingDimension
  - dbHost
  - dbPort
