name: ai-content-disclosure
version: v0.1.0
description: |
  Marks AI-generated content as such (EU AI Act Article 50 transparency
  obligation - in force since August 2026 - and similar disclosure mandates
  such as California's AI transparency requirements and China's AI-content
  labeling rules). Nothing here blocks traffic; it is a pure transparency
  control.

  On every response it can:
    - set an `x-ai-generated: true` response header (+ a configurable
      `x-ai-disclosure-standard` label naming the regulatory basis)
    - append/prepend a human-readable disclosure notice to the visible
      reply text
    - embed a short, invisible (zero-width-character-encoded) provenance
      tag into the text, independent of the visible notice, so the
      disclosure survives even if a client's UI drops response headers

  Disclosure is skipped for empty/near-empty replies and, by default, is
  idempotent - a reply that already carries the configured notice or the
  invisible tag is left alone rather than getting a second copy appended.

parameters:
  type: object
  properties:
    disclosureText:
      type: string
      x-wso2-policy-advanced-param: false
      description: The human-readable notice added to the visible reply (ignored when placement is metadata-only).
      default: "This content was generated by an AI system."
    placement:
      type: string
      enum: [append, prepend, metadata-only]
      x-wso2-policy-advanced-param: false
      description: Where the visible disclosure text goes. 'metadata-only' leaves the reply text untouched and relies on the header/invisible tag alone.
      default: append
    disclosureStandard:
      type: string
      x-wso2-policy-advanced-param: false
      description: Free-form label for the regulatory basis, attached to the response header/metadata (e.g. "eu-ai-act-art50", "ca-ai-transparency-act").
      default: "eu-ai-act-art50"
    addHeader:
      type: boolean
      x-wso2-policy-advanced-param: true
      default: true
    embedInvisibleMarker:
      type: boolean
      x-wso2-policy-advanced-param: false
      description: Embed a short zero-width-character-encoded provenance tag into the reply text, independent of the visible notice.
      default: false
    invisibleMarkerTag:
      type: string
      x-wso2-policy-advanced-param: true
      description: The short ASCII tag encoded into the invisible marker (only used when embedInvisibleMarker is true).
      default: "AI-GEN"
      maxLength: 32
    contentJsonPath:
      type: string
      x-wso2-policy-advanced-param: true
      default: "$.choices[0].message.content"
    skipIfAlreadyDisclosed:
      type: boolean
      x-wso2-policy-advanced-param: true
      description: Don't add a second visible notice / invisible tag if the reply already carries one.
      default: true
    minContentChars:
      type: integer
      x-wso2-policy-advanced-param: true
      description: Replies shorter than this are left undisclosed (nothing meaningful to label).
      default: 1
      minimum: 0

systemParameters:
  type: object
  additionalProperties: false
  properties: {}
