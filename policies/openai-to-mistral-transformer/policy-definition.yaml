name: openai-to-mistral-transformer
version: v0.9.0
description: |
  Adapts OpenAI Chat Completions requests for Mistral-compatible upstreams by
  resolving the model, stripping unsupported fields, and rewriting the
  request path. Mistral-compatible responses are passed back in OpenAI shape.

parameters:
  type: object
  additionalProperties: false
  properties:
    model:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Mistral model name used in the translated request (for example
        mistral-large-latest). Optional: the client's own model wins when
        present — read via the "requestModel" systemParameter (the location
        gateway-controller injects from the proxy's own primary-provider
        template) if set, else a plain top-level "model" field — and this is
        used only as a fallback.
      minLength: 1
    providerId:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Provider this translator targets. Used as the upstream cluster name
        (matching an id or as alias in the LlmProxy additionalProviders list) and, in
        multi-provider mode, as the key matched (case-insensitive) against
        SharedContext.Metadata["selected_provider"]. When no provider has been
        selected upstream (single-provider proxy), the translator always runs;
        when a provider has been selected, it runs only if the selection
        matches this provider id. When omitted, routing is left to the route's
        default upstream.
      minLength: 1

systemParameters:
  type: object
  properties: {}
