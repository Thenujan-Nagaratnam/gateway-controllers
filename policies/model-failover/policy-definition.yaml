# Contract: user-facing policy definition for model-failover.
# Target location: gateway-controllers/policies/model-failover/policy-definition.yaml
# (developed first via gateway/build.yaml `filePath: ./dev-policies/model-failover`).
name: model-failover
version: v0.1.0
displayName: Model Failover
description: |
  Gives each requested model its own ordered fallback chain. A request whose model
  matches a chain's primary is sent to that model; on a configured failure (selected
  status codes, connection failure, reset, or per-attempt timeout) the gateway
  retries it against that primary's next available fallback using Envoy's native
  retry, converting the request and response to and from the fallback provider's
  format. A request for a model with no chain is forwarded unchanged, with one
  attempt. Unhealthy targets are suspended and recovered through limited probe
  traffic. The gateway never fails over after the response has started streaming.

parameters:
  type: object
  additionalProperties: false
  patternProperties:
    "^_": {}          # controller-injected internal keys (research R10); rejected if authored
  properties:
    chains:
      type: array
      minItems: 1
      maxItems: 20
      x-wso2-policy-advanced-param: false
      description: |
        One chain per primary model. The request's model selects the chain; a model
        with no chain passes through. At most 50 distinct provider and model pairs
        across all chains.
      items:
        type: object
        additionalProperties: false
        properties:
          primary:
            type: object
            additionalProperties: false
            description: |
              The requested model this chain applies to, on the provider the request is
              routed to (an LlmProxy's primary provider, or the LlmProvider itself).
            properties:
              model:
                type: string
                minLength: 1
                maxLength: 256
                description: Model name, matched exactly against the request's model.
            required: [model]
          fallbacks:
            type: array
            minItems: 1
            maxItems: 9
            description: Tried in order after the primary fails.
            items:
              type: object
              additionalProperties: false
              properties:
                provider:
                  type: string
                  minLength: 1
                  description: |
                    On an LlmProxy: the id or alias of a provider attached to the proxy;
                    omitted means the primary's provider. On an LlmProvider: omit it, or
                    give the provider's own name.
                model:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: Model to request from this provider.
              required: [model]
        required: [primary, fallbacks]
    failoverOn:
      type: object
      additionalProperties: false
      x-wso2-policy-advanced-param: true
      properties:
        statusCodes:
          type: array
          uniqueItems: true
          default: [429, 500, 502, 503, 504]
          items:
            type: integer
            description: 429, or 500-599.
            anyOf:
              - const: 429
              - minimum: 500
                maximum: 599
        connectFailure: { type: boolean, default: true }
        reset:          { type: boolean, default: true }
        timeout:        { type: boolean, default: true }
    perAttemptTimeout:
      type: string
      pattern: "^[0-9]+(ms|s|m)$"
      default: "30s"
      x-wso2-policy-advanced-param: true
      description: Maximum wait for a target's response headers (1s-300s).
    suspendAfterConsecutiveFailures:
      type: integer
      minimum: 1
      maximum: 100
      default: 3
      x-wso2-policy-advanced-param: true
    suspendDuration:
      type: string
      pattern: "^[0-9]+(ms|s|m)$"
      default: "30s"
      x-wso2-policy-advanced-param: true
      description: How long a suspended target receives no normal traffic (1s-3600s).
    probeConcurrency:
      type: integer
      minimum: 1
      maximum: 10
      default: 1
      x-wso2-policy-advanced-param: true
      description: Maximum concurrent probe requests to a target in recovery.
    recoverAfterSuccessfulProbes:
      type: integer
      minimum: 1
      maximum: 20
      default: 2
      x-wso2-policy-advanced-param: true
  required: [chains]

# Controller-injected internal keys are merged into params (never systemParameters),
# see research R10: _role (front|dispatch), _chainId, _targetIds, _targetNative,
# _hopSecret, _routeToTarget. Authored params containing any "_"-prefixed key are
# rejected. On an LlmProvider the controller also merges the template's
# requestModel ({location, identifier}); the dispatch role writes each attempt's
# model there (payload JSONPath, header, queryParam, or pathParam capture group).
systemParameters:
  type: object
  properties: {}
