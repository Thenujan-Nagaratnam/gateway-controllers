name: model-failover
version: v0.1.0
description: |
  Transparently retries a failed LLM request against an ordered fallback chain, selected by
  matching the client's own request.body.model against a declared target. A target's own
  primary attempt, and every fallback attempt, is driven from a direct outbound call this
  policy makes itself rather than Envoy's native retry/aggregate-cluster mechanism.

  A target or fallback with none of provider/upstreamDefinition/backendURL set stays on the
  same backend the operation already uses (the common case: a different model on the same
  upstream). upstreamDefinition (target-level only) names a same-provider backend declared on
  this same resource's own spec.upstreamDefinitions (e.g. a backup region) - passed straight
  through as an in-process UpstreamName redirect, resolved by Envoy's own routing at runtime,
  never by this policy. backendURL (fallback-level only) is the operator-provided raw URL of a
  same-provider backend to dial directly - no reference, no resolution, just the real URL typed
  into this policy's own config. Either way the original request's own credential is reused
  unchanged, since it's still the same provider.

  provider names a provider id this proxy can route to via a header-based router policy (e.g.
  llm-header-router) attached to the SAME operation - the operator's own responsibility, same
  as wiring up any other multi-provider proxy; this policy has no awareness of how that router
  or its provider ids are configured. No separate url/auth/template is ever configured on this
  policy itself: it resolves a provider reference by dialing this same operation's own URL
  again (see selfBaseURL) with the router's header set to the chosen provider id, so the
  redialed request re-runs the full policy chain and gets its credential injection and
  request/response body translation from whatever already-attached, general-purpose policies
  the operator configured for multi-provider routing - never resolved or applied here. If no
  such router is attached, a provider reference silently reaches the operation's own default
  upstream unchanged.

  A request for a model that isn't declared as any target passes through completely untouched
  (no mutation, no retry); if that then fails, no failover applies.

parameters:
  type: object
  additionalProperties: false
  required:
    - targets
    - statusCodes
  properties:
    targets:
      type: array
      minItems: 1
      x-wso2-policy-advanced-param: false
      description: |
        One entry per independently-selectable target model. The client's own
        request.body.model must equal a target's model to select that target's whole chain.
      items:
        type: object
        additionalProperties: false
        required:
          - model
        properties:
          model:
            type: string
            minLength: 1
            description: The client-requested model name that selects this target.
          provider:
            type: string
            description: |
              A provider id this proxy can route to via a header-based router policy attached
              to the same operation. Omit for the common case (this target's primary attempt
              uses the operation's own default upstream). When set, the target's PRIMARY
              attempt itself is redirected there - required when the operation's own default
              upstream can't serve this model at all. Mutually exclusive with
              upstreamDefinition. A target that sets this must have every one of its own
              fallbacks also set provider or backendURL - there is no primary attempt left for
              a bare fallback to reuse once the primary itself is redirected.
          upstreamDefinition:
            type: string
            description: |
              Name of an entry in this LlmProvider's own spec.upstreamDefinitions. Omit for
              the common case (this target's primary attempt uses the operation's own default
              upstream). When set, the target's PRIMARY attempt itself is redirected there.
              Mutually exclusive with provider. Same fallback requirement as provider above.
          fallbacks:
            type: array
            x-wso2-policy-advanced-param: false
            description: |
              This target's own ordered fallback chain, tried in order (skipping any
              currently-suspended entry) if the primary request fails. May be empty or
              omitted: a target with no fallbacks is just routed plainly, with no failover.
            items:
              type: object
              additionalProperties: false
              required:
                - model
              properties:
                model:
                  type: string
                  minLength: 1
                  description: Model name injected into the request body for this fallback attempt.
                provider:
                  type: string
                  description: |
                    A provider id this proxy can route to via a header-based router policy
                    attached to the same operation. Omit for the common case (this fallback
                    reuses the same provider as its own target - same backend, just a
                    different model). Mutually exclusive with backendURL.
                backendURL:
                  type: string
                  description: |
                    Base URL (scheme://host[:port], no path) of a same-provider backend to dial
                    directly for this fallback (e.g. a backup region) - the real URL, typed
                    directly here; not a reference to anything declared elsewhere. Omit for the
                    common case (this fallback reuses the same backend as its own target).
                    Mutually exclusive with provider.
    statusCodes:
      type: array
      minItems: 1
      x-wso2-policy-advanced-param: false
      description: |
        Response status codes that trigger failover to the next target in whichever chain
        matched. Mandatory, no default: which codes actually signal a model/capacity problem
        varies significantly by provider, so a single built-in default would either miss a real
        outage signal or trigger a wasteful cross-provider retry on what was really a
        client-caused error. Commonly relevant codes per provider (verify against that
        provider's own current docs before relying on this):
          - OpenAI: 429 (rate limit/quota), 500, 503 (engine overloaded)
          - Anthropic: 404 (unknown/stale model), 429, 500, 529 (overloaded - Anthropic-specific,
            not the standard 503)
          - AWS Bedrock: 404 (ResourceNotFoundException), 408 (ModelTimeoutException), 424
            (ModelErrorException - Bedrock-specific), 429 (ThrottlingException AND
            ModelNotReadyException), 500, 503. Quota-exceeded is 400 here, not 429 - decide
            deliberately whether to include it.
          - Azure OpenAI: 404 (deployment not found), 429, 500, 503
          - Google Gemini: 404 (NOT_FOUND), 429 (RESOURCE_EXHAUSTED), 500, 503 (UNAVAILABLE)
          - Mistral: 429, 500, 502, 503, 504
        429 in particular deserves a deliberate decision rather than a reflexive include: it may
        be better served by backoff-and-retry against the SAME backend (respecting Retry-After)
        than by paying for a cross-provider fallback attempt.
      items:
        type: integer
        minimum: 100
        maximum: 599
    requestTimeout:
      type: string
      x-wso2-policy-advanced-param: true
      description: Per-attempt dial timeout (e.g. "10s"). Defaults to 10s when unset.
    suspendDuration:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        How long a failed fallback is deprioritized for future requests to its own chain (e.g.
        "30s"). Omit to disable suspend tracking entirely. Never applies to a target's own
        primary attempt.
    maxResponseBytes:
      type: integer
      x-wso2-policy-advanced-param: true
      description: Per-attempt response size ceiling in bytes. Defaults to 10MiB when unset.
    selfBaseURL:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        Base URL (scheme://host:port, no path) this policy dials back to for a provider redial
        - the operation's own externally-facing address as reachable from within the gateway
        process itself. Defaults to http://127.0.0.1:8080, the router's own default listener
        address. Only needs setting explicitly if the deployment changes router.listener_port
        away from its default. Irrelevant if no target/fallback ever declares provider.
