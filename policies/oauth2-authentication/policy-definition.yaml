name: oauth2-authentication
version: v0.1.0
description: |
  Authenticates outbound requests to an upstream backend using the OAuth2
  Client Credentials grant (RFC 6749 Section 4.4) before they are forwarded.
  The gateway acts as a confidential client: it exchanges a client ID and
  secret for a short-lived access token at a configured token endpoint, then
  injects the token as an Authorization: Bearer header. Tokens are cached and
  refreshed automatically ahead of expiry.

parameters:
  type: object
  additionalProperties: false
  properties:
    tokenEndpoint:
      type: string
      x-wso2-policy-advanced-param: false
      minLength: 1
      description: |
        URL of the OAuth2 token endpoint this policy calls to obtain an
        access token via the client_credentials grant.
    clientId:
      type: string
      x-wso2-policy-advanced-param: false
      minLength: 1
      description: |
        OAuth2 client ID used to authenticate to the token endpoint.
    clientSecret:
      type: string
      x-wso2-policy-advanced-param: true
      minLength: 1
      description: |
        OAuth2 client secret paired with clientId.
    scope:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Optional space-separated list of scopes requested from the token
        endpoint.
    clientAuthMethod:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Selects how the client ID and secret are presented to the token
        endpoint. "client_secret_basic" sends them as HTTP Basic auth on the
        token request. "client_secret_post" sends them as form fields in the
        POST body. There is no default: different identity providers require
        different conventions (for example, Azure AD requires
        client_secret_post), so a wrong silent default would fail at request
        time instead of at configuration time.
      enum:
        - client_secret_basic
        - client_secret_post
  required:
    - tokenEndpoint
    - clientId
    - clientSecret
    - clientAuthMethod
